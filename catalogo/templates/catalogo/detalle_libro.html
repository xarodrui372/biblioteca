<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Libros</title>
</head>
<body>
  <h1>{{libro.titulo}}</h1>
  <h2>Autores: </h2>
  <ul>
    {% for autor in libro.autores.all %}
      <li>{{autor.nombre}}</li>
    {% empty %}
      <li>No se encuentra ningún registro</li>
    {% endfor %}
  </ul>
</body>
</html>
