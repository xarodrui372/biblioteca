<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libros de una editorial</title>
</head>
<body>
  <h1>{{editorial.nombre}}</h1>
  <h2>Libros:</h2>
  <ul>
    <!-- {% for libro in editorial.libros.all %}
      <li>{{libro.titulo}}</li>
    {% empty %}
      <li>No se encuentran ningun registro</li>
    {% endfor %} -->
    {% for libro in editorial.libros_disponibles %}
      <li>{{libro.titulo}}</li>
    {% empty %}
      <li>No hay libros disponibles en esta editorial.</li>
    {% endfor %}
  </ul>
</body>
</html>
